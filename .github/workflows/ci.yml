name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Dead code and unused dependencies
        run: pnpm knip
      - run: pnpm turbo run lint typecheck test build --cache-dir=.turbo/cache

  integration:
    name: Integration tests (Postgres, Redis, RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: solmira
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solmira" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: solmira
          RABBITMQ_DEFAULT_PASS: ci_password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 20
      dynamodb:
        image: amazon/dynamodb-local:2.6.1
        ports: ['8000:8000']
    env:
      TEST_DATABASE_URL: postgres://solmira:ci_password@localhost:5432/postgres
      # Superuser connection the identity suites use to provision a throwaway database with
      # separate owner and runtime (RLS-restricted) roles.
      TEST_ADMIN_DATABASE_URL: postgres://solmira:ci_password@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_RABBITMQ_URL: amqp://solmira:ci_password@localhost:5672
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@solmira/identity-service... --filter=@solmira/ingest-service... --filter=@solmira/dispatcher... --filter=@solmira/notification-service... --filter=@solmira/analytics-service...
      - run: pnpm --filter @solmira/service-kit test:integration
      - name: Identity, authorization and tenant-isolation suites
        run: pnpm --filter @solmira/identity-service test:integration
      - name: Ingest service suites
        run: pnpm --filter @solmira/ingest-service test:integration
      - name: Notification service suites
        run: pnpm --filter @solmira/notification-service test:integration
      - name: Dispatcher suites
        run: pnpm --filter @solmira/dispatcher test:integration
      - name: Analytics suites
        run: pnpm --filter @solmira/analytics-service test:integration

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The compose file creates the service databases and roles; the services themselves run on
      # the runner, started by Playwright, and the browser enters through the gateway.
      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis rabbitmq dynamodb mailpit
      - name: Service environment files
        run: |
          cp apps/identity-service/.env.example apps/identity-service/.env
          cp apps/ingest-service/.env.example apps/ingest-service/.env
          cp apps/notification-service/.env.example apps/notification-service/.env
          cp apps/analytics-service/.env.example apps/analytics-service/.env
          cp apps/web/.env.example apps/web/.env
          pnpm --filter @solmira/identity-service keys:generate
      - run: docker compose up -d --wait gateway
      - run: pnpm --filter @solmira/web exec playwright install --with-deps chromium
      - run: pnpm --filter @solmira/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high

  docker:
    name: Docker image (${{ matrix.image }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: identity-service, dockerfile: infra/docker/service.Dockerfile }
          - { image: ingest-service, dockerfile: infra/docker/service.Dockerfile }
          - { image: dispatcher, dockerfile: infra/docker/service.Dockerfile }
          - { image: notification-service, dockerfile: infra/docker/service.Dockerfile }
          - { image: analytics-service, dockerfile: infra/docker/service.Dockerfile }
          - { image: audit-service, dockerfile: infra/docker/service.Dockerfile }
          - { image: web, dockerfile: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only; pushing to ECR and deployment are added with the AWS infrastructure (phase 12).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE=${{ matrix.image }}
          push: false
          tags: solmira/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
