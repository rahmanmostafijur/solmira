packages:
  - apps/*
  - packages/*
  - tests/*

# Install scripts are opt-in. @scarf/scarf (usage telemetry pulled in by swagger-ui-dist) stays disabled.
ignoredBuiltDependencies:
  - '@scarf/scarf'

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver

# Security floors for transitive dependencies (pnpm audit): postcss under next pins an older one.
overrides:
  source-map-js: 1.2.2
