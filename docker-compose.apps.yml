# Overlay that runs the application tier in containers, built from the production Dockerfiles.
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

x-common-env: &common-env
  NODE_ENV: production
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://solmira:${RABBITMQ_PASSWORD:-solmira_dev_password}@rabbitmq:5672

services:
  # One-off deployment step: apply migrations as the schema owner, then exit.
  identity-migrate:
    image: solmira-identity-service
    build:
      {
        context: .,
        dockerfile: infra/docker/service.Dockerfile,
        args: { SERVICE: identity-service },
      }
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://identity_owner:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_identity

  identity-service:
    <<: *service-defaults
    image: solmira-identity-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-migrate: { condition: service_completed_successfully }
    # Signing keys come from the developer's local .env (`pnpm --filter @solmira/identity-service
    # keys:generate`). Values under `environment` override the host-oriented URLs in that file.
    env_file:
      - path: apps/identity-service/.env
        required: true
    environment:
      <<: *common-env
      PORT: 4001
      LOG_PRETTY: 'false'
      DATABASE_URL: postgres://identity_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_identity
      MIGRATION_DATABASE_URL: ''
      APP_URL: http://localhost:${GATEWAY_PORT:-8080}
      SMTP_URL: smtp://mailpit:1025

  ingest-migrate:
    image: solmira-ingest-service
    build:
      { context: ., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: ingest-service } }
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://ingest_owner:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_ingest

  ingest-service:
    <<: *service-defaults
    image: solmira-ingest-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ingest-migrate: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      PORT: 4002
      DATABASE_URL: postgres://ingest_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_ingest
      IDENTITY_JWKS_URL: http://identity-service:4001/api/v1/auth/.well-known/jwks.json
      # Development key; deployed environments use KMS (ADR-0026). Override with INGEST_SECRETS_KEY.
      SECRETS_ENCRYPTION_KEY: ${INGEST_SECRETS_KEY:-jwQOFPGSgMYBdzcMS4iBQfZGKQY8Iwi1LU+DxYyoREc=}

  notification-migrate:
    image: solmira-notification-service
    build:
      {
        context: .,
        dockerfile: infra/docker/service.Dockerfile,
        args: { SERVICE: notification-service },
      }
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://notification_owner:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_notification

  notification-service:
    <<: *service-defaults
    image: solmira-notification-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      notification-migrate: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      PORT: 4003
      IDENTITY_JWKS_URL: http://identity-service:4001/api/v1/auth/.well-known/jwks.json
      DATABASE_URL: postgres://notification_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_notification

  analytics-migrate:
    image: solmira-analytics-service
    build:
      {
        context: .,
        dockerfile: infra/docker/service.Dockerfile,
        args: { SERVICE: analytics-service },
      }
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://analytics_owner:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_analytics

  analytics-service:
    <<: *service-defaults
    image: solmira-analytics-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      analytics-migrate: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      PORT: 4004
      IDENTITY_JWKS_URL: http://identity-service:4001/api/v1/auth/.well-known/jwks.json
      DATABASE_URL: postgres://analytics_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_analytics

  audit-migrate:
    image: solmira-audit-service
    build:
      { context: ., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: audit-service } }
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MIGRATION_DATABASE_URL: postgres://audit_owner:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_audit

  audit-service:
    <<: *service-defaults
    image: solmira-audit-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      audit-migrate: { condition: service_completed_successfully }
    environment:
      <<: *common-env
      PORT: 4005
      IDENTITY_JWKS_URL: http://identity-service:4001/api/v1/auth/.well-known/jwks.json
      DATABASE_URL: postgres://audit_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_audit

  # The delivery worker (ADR-0031). It uses the ingest database as its own, narrower role and has
  # no inbound API beyond health. DynamoDB Local holds the attempt history.
  dispatcher:
    restart: unless-stopped
    build:
      { context: ., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: dispatcher } }
    depends_on:
      postgres: { condition: service_healthy }
      dynamodb: { condition: service_started }
      ingest-migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 4006
      DATABASE_URL: postgres://dispatcher_app:${SERVICE_DB_PASSWORD:-solmira_service_dev_password}@postgres:5432/solmira_ingest
      # Development key; deployed environments use KMS (ADR-0026). Must match ingest-service.
      SECRETS_ENCRYPTION_KEY: ${INGEST_SECRETS_KEY:-jwQOFPGSgMYBdzcMS4iBQfZGKQY8Iwi1LU+DxYyoREc=}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLE: 'true'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

  web:
    restart: unless-stopped
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      NODE_ENV: production
      GATEWAY_INTERNAL_URL: http://gateway

  gateway:
    environment:
      WEB_UPSTREAM: web:3000
      IDENTITY_UPSTREAM: identity-service:4001
      INGEST_UPSTREAM: ingest-service:4002
      NOTIFICATION_UPSTREAM: notification-service:4003
      ANALYTICS_UPSTREAM: analytics-service:4004
      AUDIT_UPSTREAM: audit-service:4005
      DISPATCHER_UPSTREAM: dispatcher:4006
