proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;

# The gateway is authoritative for these response headers (set at server level). Services also set
# them for direct access; hiding the upstream copies avoids duplicate, conflicting values.
proxy_hide_header X-Request-Id;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
