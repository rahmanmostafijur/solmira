worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;
  client_max_body_size 10m;

  # Keep a well-formed incoming correlation ID (for example from an upstream system);
  # otherwise the request ID starts a new correlation chain.
  map $http_x_correlation_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_correlation_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # $uri, not $request_uri: query strings can carry tokens and must not reach the logs.
  log_format json_access escape=json
    '{"time":"$time_iso8601","service":"gateway","requestId":"$request_id",'
    '"correlationId":"$correlation_id","remoteAddr":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"durationSec":$request_time,'
    '"upstream":"$upstream_addr","upstreamSec":"$upstream_response_time","userAgent":"$http_user_agent"}';
  access_log /dev/stdout json_access;

  # Edge rate limits are a coarse first line of defence; services apply per-account limits too.
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_req_status 429;

  # Docker's embedded DNS. Upstreams are resolved per request (see the template), so the gateway
  # starts even when a service is down and picks up restarted containers.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Only our rendered templates; the image's stock conf.d/default.conf is deliberately not loaded.
  include /etc/nginx/solmira.d/*.conf;
}
